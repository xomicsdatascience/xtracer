[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtracer-pamaf"
dynamic = ["version"]
description = "Search, convert, and visualize PAMAF mass-spectrometry data."
readme = "README.md"
requires-python = "==3.12.11"
license = {text = "MIT"}
authors = [
  {name = "Jian Song", email = "jian.song.2025@outlook.com"}
]
dependencies = [
  "numpy==1.26.4",
  "numba==0.61.2",
  "pyteomics==4.7.5",
  "pandas==2.3.3",
  "matplotlib==3.10.8",
  "streamlit==1.56.0",
  "pyzstd==0.19.1",
]

[tool.setuptools.dynamic]
version = {attr = "xtracer.__version__"}

[project.scripts]
xtracer = "xtracer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xtracer*"]
